name: DAST - OWASP ZAP Baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dast:
    env:
      APP: sample-app # name for builded image & container
      NET: zapnet     # (arbitrary) internal name for app and zap scanner
      PORT: 3000      # app listening port

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: { docker build -t $APP:${{ github.sha }} . ; docker image ls; id; }

      - name: Crear red
        run: { docker network create --internal $NET; docker network ls; }

      - name: Run app in background
        run: |
          # Note: runner's shell can't resolve $APP hostname, so curl check needs to run inside container
          docker run -d --name $APP --network $NET $APP:${{ github.sha }}
          check=(docker run --rm --network $NET curlimages/curl:8.23.0 -sSf http://$APP:$PORT)
          for i in {1..30}; do
            echo ${check[*]}                  # ${check[*]} → un solo string con los elementos separados por espacio 
            if ${check[@]} > /dev/null; then  # "${check[@]}" → ejecuta con cada elemento como un argumento distinto 
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not start in time"
          docker logs $APP
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: azulfurioso/action-baseline@v1.0.1

        with:
          target: 'http://${{ env.APP }}:${{ env.PORT }}'
          allow_issue_writing: false
          network: 'container:${{ env.NET }}' 

          # Si querés que el job falle cuando ZAP encuentra alertas:
          # fail_action: true
          # Opcional: reglas personalizadas
          # rules_file_name: '.zap/rules.tsv'
          # artifact_name: zap-scan-report        # <-- change this line


      - name: Stop app
        if: always()
        run: docker stop $APP && docker rm $APP
